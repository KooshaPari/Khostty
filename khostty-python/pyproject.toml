[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "khostty-vt"
version = "0.1.0"
description = "Python bindings for libghostty-vt, the terminal emulator from Ghostty"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["terminal", "vt", "ghostty", "emulator", "cffi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]
dependencies = ["cffi>=1.15"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/KooshaPari/Khostty"

[tool.setuptools]
packages = ["khostty_vt"]

[tool.setuptools.package-data]
khostty_vt = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
