# Gitleaks configuration for Khostty
#
# The default ruleset reports seven `generic-api-key` findings on this tree
# (observed 2026-09-29, CI run 36584839303). All seven were inspected and all
# seven are false positives, not leaked credentials:
#
#   .github/workflows/release-tip.yml  (3)  `${{ secrets.* }}` references
#   .github/workflows/release-tag.yml  (1)  `${{ secrets.* }}` references
#   src/input/Binding.zig              (1)  the literal "GhosttyBindingAction"
#   src/terminal/snapshot/terminal.zig (1)  a snapshot/struct identifier
#   vendor/nerd-fonts/font-patcher.py  (1)  a vendored upstream constant
#
# The two source hits are long, high-entropy *identifiers*; the workflow hits are
# the `${{ secrets.NAME }}` indirection itself, which the generic rule reads as a
# key because the surrounding text reads "token"/"auth". Upstream vendored code
# must not be edited to satisfy a scanner, so it is path-allowlisted here instead.
#
# This allowlist is deliberately narrow: it pins exact paths plus a regex tied to
# the specific identifiers, so a genuine secret added to one of these files later
# still trips the scanner. It was last verified 2026-09-29.

[extend]
useDefault = true

[allowlist]
description = "False positives only. Do not widen without re-running CI run 36584839303's scan."
paths = [
  '''vendor/nerd-fonts/''',
  '''\.github/workflows/release-(tip|tag)\.yml''',
]
regexes = [
  '''GhosttyBindingAction''',
]
