name: Experiment - K-E03 wrapper vs direct C

on:
  push:
    branches:
      - experiment/mature-recovery-k-e03
  pull_request:
    branches:
      - main
    paths:
      - khostty-vt/**
      - .github/actions/install-zig/action.yml
      - .github/workflows/experiment-k-e03-compare.yml
      - docs/experiments/k-e03/**

permissions:
  contents: read

jobs:
  compare:
    name: K-E03 linked wrapper/direct-C evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RECOVERY_BASELINE: a29aa9c6553d9f42aa68e2919116c0f6d53f329d
      UPSTREAM_MERGE_BASE: d4c88d8069912b653d707191388ca98e24751f12
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Verify exact candidate checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: ./.github/actions/install-zig
        with:
          version: "0.16.0"
          shasum: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - name: Validate experiment harness syntax
        run: python3 -m py_compile khostty-vt/tools/k_e03_compare.py

      - name: Build exact candidate native VT library
        run: |
          set -euo pipefail
          zig build -Demit-lib-vt
          test -f zig-out/lib/libghostty-vt.so
          sha256sum zig-out/lib/libghostty-vt.so | tee candidate-lib.sha256

      - name: Run candidate wrapper/direct-C harness
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 khostty-vt/tools/k_e03_compare.py             --crate-dir khostty-vt             --include-dir include             --lib zig-out/lib/libghostty-vt.so             --source-sha "$CANDIDATE_SHA"             --library-source-sha "$CANDIDATE_SHA"             --library-origin khostty             --out k-e03-candidate.json

      - name: Checkout exact upstream merge base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ghostty-org/ghostty
          ref: ${{ env.UPSTREAM_MERGE_BASE }}
          path: upstream-ghostty
          fetch-depth: 1

      - name: Build upstream merge-base native VT library
        working-directory: upstream-ghostty
        run: |
          set -euo pipefail
          zig build -Demit-lib-vt
          test -f zig-out/lib/libghostty-vt.so
          sha256sum zig-out/lib/libghostty-vt.so | tee ../upstream-lib.sha256

      - name: Run wrapper/direct-C harness against upstream library
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 khostty-vt/tools/k_e03_compare.py             --crate-dir khostty-vt             --include-dir upstream-ghostty/include             --lib upstream-ghostty/zig-out/lib/libghostty-vt.so             --source-sha "$CANDIDATE_SHA"             --library-source-sha "$UPSTREAM_MERGE_BASE"             --library-origin upstream-ghostty             --out k-e03-upstream.json

      - name: Require both comparison receipts to pass
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          failed=[]
          for name in ("k-e03-candidate.json","k-e03-upstream.json"):
              p=pathlib.Path(name)
              if not p.is_file():
                  failed.append(f"{name}: missing")
                  continue
              data=json.loads(p.read_text())
              if data.get("verdict") != "PASS_EXPERIMENT":
                  failed.append(f"{name}: {data.get('verdict')} {data.get('checks')}")
          if failed:
              print("\n".join(failed), file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Record immutable identities
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          printf '%s\n' "$CANDIDATE_SHA" > candidate-sha.txt
          git rev-parse "$RECOVERY_BASELINE" > recovery-baseline-sha.txt
          git -C upstream-ghostty rev-parse HEAD > upstream-sha.txt || true
          rustc --version > rust-version.txt
          cargo --version > cargo-version.txt
          zig version > zig-version.txt
          cc --version > cc-version.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: k-e03-linked-comparison
          path: |
            candidate-lib.sha256
            upstream-lib.sha256
            k-e03-candidate.json
            k-e03-upstream.json
            candidate-sha.txt
            recovery-baseline-sha.txt
            upstream-sha.txt
            rust-version.txt
            cargo-version.txt
            zig-version.txt
            cc-version.txt
          if-no-files-found: warn
          retention-days: 30
