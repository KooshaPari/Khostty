# =============================================================================
# FORK: DISABLED for automatic triggers. Manual dispatch only.
# =============================================================================
# `vouch` is upstream Ghostty's contributor-trust bot, and every job in this
# workflow targets `namespace-profile-ghostty-xsm` -- a Namespace Cloud
# self-hosted runner profile that this fork does not have. The VOUCH_APP_ID /
# VOUCH_APP_PRIVATE_KEY secrets are likewise upstream-only.
#
# Observed on KooshaPari/Khostty: these runs never do work; they queue against
# a nonexistent runner and then cancel, occupying queue capacity that the real
# checks need. A single-owner fork has no external contributors to vouch for,
# so the function is not applicable here either.
#
# Nothing is deleted: the file is preserved and can be dispatched by hand.
# =============================================================================

on:
  workflow_dispatch: {}

name: "Vouch - Manage by Issue"

concurrency:
  group: vouch-manage
  cancel-in-progress: false

jobs:
  manage:
    runs-on: namespace-profile-ghostty-xsm
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.VOUCH_APP_ID }}
          private-key: ${{ secrets.VOUCH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: mitchellh/vouch/action/manage-by-issue@d66fa29a64600490892131ad87597c30c91fcac4 # v1.5.0
        with:
          repo: ${{ github.repository }}
          issue-id: ${{ github.event.issue.number }}
          comment-id: ${{ github.event.comment.id }}
          vouch-keyword: "!vouch"
          denounce-keyword: "!denounce"
          unvouch-keyword: "!unvouch"
          pull-request: "true"
          merge-immediately: "true"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
