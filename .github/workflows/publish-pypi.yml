# Publish the Khostty Python distribution to PyPI.
#
# Scope: this repository publishes `khostty-vt` on PyPI. The Python package is a
# thin ctypes binding over `libghostty-vt`; the Rust crate and the npm WASM
# package are published by their own paths (cargo publish, npm publish).
#
# Auth: PyPI Trusted Publishing (OIDC) when `pypi` is configured as a trusted
# publisher for `khostty-vt`. No long-lived API token is stored in this repo.
# If Trusted Publishing is not configured, the upload step fails closed rather
# than falling back to a secret.
#
# Gate: tags matching `khostty-v*` that belong to THIS repository. The inherited
# Ghostty workflows in .github/workflows trigger on any `v*.*.*` tag; this
# workflow must never publish a Ghostty artifact to the Khostty PyPI project.
#
# Build and publish are deliberately separate jobs. Per the action's documented
# security model, the job that holds `id-token: write` must not also run build
# machinery, so a poisoned build dependency cannot steal the publish identity.

name: Publish PyPI

on:
  push:
    tags:
      - "khostty-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to publish (format: khostty-vX.Y.Z)"
        required: true

# PyPI forbids reusing a distribution filename, ever. Serialize uploads and
# never cancel an in-flight publish.
concurrency:
  group: pypi-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref }}

      - name: Reject non-Khostty tags
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          INPUT_TAG: ${{ github.event.inputs.version }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          if [[ "$tag" != khostty-v* ]]; then
            echo "Refusing to build: '$tag' is not a khostty-v* tag."
            exit 1
          fi
          if [ ! -f khostty-python/pyproject.toml ]; then
            echo "Refusing to build: '$tag' has no khostty-python/pyproject.toml."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Read package version
        id: version
        working-directory: khostty-python
        run: |
          version="$(python -c '
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])
          ')"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "pyproject version: $version"

      - name: Check tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        working-directory: khostty-python
        env:
          INPUT_TAG: ${{ github.event.inputs.version }}
          PKG_VERSION: ${{ steps.version.outputs.value }}
        run: |
          effective_tag="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          tag_version="${effective_tag#khostty-v}"
          echo "tag=$tag_version pyproject=$PKG_VERSION"
          if [ "$tag_version" != "$PKG_VERSION" ]; then
            echo "Refusing to publish: tag version does not match pyproject.toml."
            exit 1
          fi

      - name: Build distributions
        working-directory: khostty-python
        run: python -m build

      - name: Validate distributions
        working-directory: khostty-python
        run: |
          python -m twine check dist/*
          ls -l dist/

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dists
          path: khostty-python/dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/khostty-vt/
    permissions:
      # Mandatory for Trusted Publishing. Scoped to this job only: the build job
      # above has no OIDC permission and cannot mint a PyPI token.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Attestations (PEP 740) are generated automatically under Trusted
          # Publishing; leaving this unset is the recommended default.
          print-hash: true
