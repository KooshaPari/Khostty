name: Go bindings (Windows)

on:
  pull_request:
    paths:
      - "khostty-go/**"
      - "include/ghostty/**"
      - "src/**"
      - "pkg/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/workflows/go-windows.yml"
  push:
    branches: [main]
    paths:
      - "khostty-go/**"
      - "include/ghostty/**"
      - "src/**"
      - "pkg/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/workflows/go-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-windows:
    if: github.repository == 'KooshaPari/Khostty'
    # Pinned to `windows-2022`, and the pin is the point: BOTH `windows-latest`
    # and `windows-2025` resolve to image `windows-2025-vs2026/20261116.315`
    # (measured: run 44848423316 on windows-latest, run 44852435495 on
    # windows-2025, identical `Image:` line). That image ships VS 18 / MSVC
    # 14.52.37025, whose headers break zig 0.16.0's compile of the vendored
    # simdutf and turn this gate red for a reason that has nothing to do with
    # our code:
    #   pkg/simdutf/vendor/simdutf.cpp:22295:32: error: array index 3 is past
    #   the end of the array (that has type 'const simd8<unsigned char, 16>')
    #   error: 5 compilation errors   (target native-native-msvc)
    # The same 5 errors appear on 2026-11-20 (runs 44652233281, 44666555398) and
    # the last green run (44704605807) used an older release of the same label,
    # win25-vs2026/20261103.298, so this tracks the image rolling forward.
    # `windows-2022` is the separate VS 2022 image family; move back to
    # `windows-latest` once simdutf survives the VS 18 headers.
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.3"
          cache: false
      # 2026-11-21: without this, `zig build` resolves pkg/translate-c over the
      # live network and a codeberg 504 fails the job (measured on
      # ci-fork-discipline at 11:34Z on aa6e92dc0).
      - uses: ./.github/actions/fetch-zig-deps
      - name: Build DLL and import library
        run: zig build -Demit-lib-vt -Doptimize=ReleaseFast
      - name: Build Go packages and examples
        working-directory: khostty-go
        run: |
          . ./tools/windows-env.ps1
          go build ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Vet Go packages
        working-directory: khostty-go
        run: |
          . ./tools/windows-env.ps1
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Go tests against DLL
        working-directory: khostty-go
        run: |
          . ./tools/windows-env.ps1
          go test -count=1 -v ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
