name: Experiment - K-E02a app-thread bridge

on:
  push:
    branches: [experiment/mature-recovery-k-e02a-app-bridge]
  pull_request:
    branches: [main]
    paths:
      - "src/App.zig"
      - "src/apprt/ipc/app_thread_bridge.zig"
      - ".github/workflows/experiment-k-e02a-app-bridge.yml"

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install Zig with verified primary + official mirror fallback
        shell: bash
        run: |
          set -euo pipefail
          version=0.16.0
          expected=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          urls=(
            "https://ziglang.org/download/$version/zig-x86_64-linux-$version.tar.xz"
            "https://pkg.machengine.org/zig/zig-x86_64-linux-$version.tar.xz"
          )
          ok=0
          for url in "${urls[@]}"; do
            rm -f /tmp/zig.tar.xz
            if curl --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 300 -o /tmp/zig.tar.xz "$url"; then
              actual="$(sha256sum /tmp/zig.tar.xz | cut -d' ' -f1)"
              if [ "$actual" = "$expected" ]; then ok=1; break; fi
            fi
          done
          test "$ok" = 1
          dest="${RUNNER_TOOL_CACHE}/zig/$version/x64"
          mkdir -p "$dest"
          tar -xJf /tmp/zig.tar.xz -C "$dest" --strip-components=1
          echo "$dest" >> "$GITHUB_PATH"
      - name: Format diagnostic
        run: |
          set +e
          zig fmt src/App.zig src/apprt/ipc/app_thread_bridge.zig src/apprt/ipc/protocol.zig src/apprt/ipc/handler.zig src/apprt/ipc/server.zig
          git diff -- src/App.zig src/apprt/ipc/app_thread_bridge.zig src/apprt/ipc/protocol.zig src/apprt/ipc/handler.zig src/apprt/ipc/server.zig
          echo "FORMAT_DIRTY=$(git diff --quiet -- src/App.zig src/apprt/ipc/app_thread_bridge.zig src/apprt/ipc/protocol.zig src/apprt/ipc/handler.zig src/apprt/ipc/server.zig; echo $?)" >> "$GITHUB_ENV"
          git checkout -- src/App.zig src/apprt/ipc/app_thread_bridge.zig src/apprt/ipc/protocol.zig src/apprt/ipc/handler.zig src/apprt/ipc/server.zig
          exit 0
      - name: Bridge controls
        run: zig test src/apprt/ipc/app_thread_bridge.zig
      - name: Protocol controls
        run: zig test src/apprt/ipc/protocol.zig
      - name: Handler controls
        run: zig test src/apprt/ipc/handler.zig
      - name: Server lifecycle controls
        run: zig test src/apprt/ipc/server.zig
      - name: Reject detached-worker lifecycle regression by source contract
        run: |
          grep -q "force-disconnects idle clients" src/apprt/ipc/server.zig
          grep -q "IPC connection workers outlived server dependencies" src/apprt/ipc/server.zig
      - name: Compile core path
        run: zig build -Dapp-runtime=gtk -Doptimize=Debug
      - name: Enforce format after semantic gates
        if: always()
        run: test "${FORMAT_DIRTY:-1}" = 0
