name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  merge_group:
    branches: [main, master, develop]
  # Added 2026-09-29: this workflow had never produced a run, so there was no way
  # to verify the pipeline on the released tree. A manual trigger makes it
  # checkable without waiting for a push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zig-fmt:
    name: Zig Fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-zig
        with:
          version: "0.16.0"
          # Official sha256 for zig-x86_64-linux-0.16.0.tar.xz, from
          # https://ziglang.org/download/index.json (read 2026-09-29).
          shasum: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
      # Scope was `src/ build.zig`, which is the upstream tree. The fork adds
      # `tools/` and `conformance/`, and both had drifted: 7 fork-authored
      # files were unformatted (`tools/check-fork-discipline.zig` plus six
      # `conformance/cases/*/cases.zig`) while this gate reported success,
      # because it never looked at them. `zig fmt --check .` is not the fix:
      # it also walks `zig-pkg/`, which is vendored dependency source that
      # must not be reformatted.
      - run: zig fmt --check src/ build.zig tools/ conformance/

  build:
    name: Build (macOS)
    # Billed macOS runners are disabled by repository policy, so this job is
    # opt-in rather than unconditionally dead. `vars` IS a permitted context in
    # a job-level `if`; set repository variable ENABLE_MACOS_BUILD=true to run
    # it. Previously this was `if: ${{ false }}`, which triggered actionlint's
    # `constant expression "false" in condition` and could never be flipped
    # without editing the file.
    if: ${{ vars.ENABLE_MACOS_BUILD == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-zig
        with:
          version: "0.16.0"
          shasum: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
      - name: Select Xcode
        run: |
          # Use latest available Xcode (macos-latest ships with the newest).
          # Glob rather than `ls | grep` (SC2010) and quote the substitution
          # (SC2046) so a path with spaces cannot split the argument.
          newest="$(printf '%s\n' /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "${newest}" || true
      - run: zig build -Doptimize=ReleaseSafe -Demit-macos-app=false

  detect:
    name: Detect Languages
    runs-on: ubuntu-latest
    outputs:
      has_rust: ${{ steps.detect.outputs.has_rust }}
      has_deny: ${{ steps.detect.outputs.has_deny }}
      has_python: ${{ steps.detect.outputs.has_python }}
      has_go: ${{ steps.detect.outputs.has_go }}
      has_typescript: ${{ steps.detect.outputs.has_typescript }}
      has_security: ${{ steps.detect.outputs.has_security }}
      has_trunk: ${{ steps.detect.outputs.has_trunk }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: detect
        run: |
          set +e
          # Initialize all outputs to false (critical: every output must be set).
          # One grouped redirect rather than seven (SC2129).
          {
            echo "has_rust=false"
            echo "has_deny=false"
            echo "has_python=false"
            echo "has_go=false"
            echo "has_typescript=false"
            echo "has_security=false"
            echo "has_trunk=false"
          } >> "$GITHUB_OUTPUT"

          # Rust: a Cargo.toml anywhere in the tree (khostty-vt/Cargo.toml).
          # The previous `[ -f "**/Cargo.toml" ]` was a literal string test — `sh`
          # does not glob-expand inside quotes — so it never matched and the Rust
          # job was silently skipped on every run.
          if find . -name Cargo.toml -not -path '*/node_modules/*' -type f 2>/dev/null | head -1 | grep -q .; then
            echo "has_rust=true" >> "$GITHUB_OUTPUT"
            if find . -name deny.toml -not -path '*/node_modules/*' -type f 2>/dev/null | head -1 | grep -q .; then
              echo "has_deny=true" >> "$GITHUB_OUTPUT"
            fi
          fi

          # Python: needs pyproject.toml, setup.py, requirements.txt, or *.py
          if [ -f "pyproject.toml" ] || [ -f "setup.py" ] || [ -f "requirements.txt" ] || find . -maxdepth 3 -name "*.py" -type f 2>/dev/null | head -1 | grep -q .; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          fi

          # Python TEST suite, tracked separately from has_python. The Python
          # job above only runs ruff (lint + format); it never executed a
          # single test. khostty-python/tests/ holds 162 tests that no workflow
          # ever collected, so a regression in the bindings shipped silently
          # to PyPI. Linting green is not testing green.
          if find . -maxdepth 3 -type d -name tests -not -path '*/node_modules/*' 2>/dev/null | head -1 | grep -q .; then
            echo "has_python_tests=true" >> "$GITHUB_OUTPUT"
          fi

          # Go: a go.mod anywhere in the tree (khostty-go/go.mod).
          if find . -name go.mod -not -path '*/node_modules/*' -type f 2>/dev/null | head -1 | grep -q .; then
            echo "has_go=true" >> "$GITHUB_OUTPUT"
          fi

          # TypeScript / JS: a package.json anywhere in the tree (wasm/, khostty-vt-wasm).
          if find . -name package.json -not -path '*/node_modules/*' -type f 2>/dev/null | head -1 | grep -q .; then
            echo "has_typescript=true" >> "$GITHUB_OUTPUT"
          fi

          # Security: always run (bandit/gitleaks/dependency-review)
          echo "has_security=true" >> "$GITHUB_OUTPUT"

          # Trunk: only if trunk.yaml exists
          if [ -f "trunk.yaml" ]; then
            echo "has_trunk=true" >> "$GITHUB_OUTPUT"
          fi

          echo ""
          echo "=== Detected ==="
          echo "rust=$has_rust deny=$has_deny python=$has_python go=$has_go typescript=$has_typescript security=$has_security trunk=$has_trunk"

  rust:
    name: Rust
    needs: detect
    if: needs.detect.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, not `@stable`. The clippy gate below is only meaningful against a
      # known ruleset: clippy 0.1.99 is what was measured clean, and a future
      # stable that adds a lint would otherwise turn main red with no commit
      # behind it. Same reasoning as the date-pinned nightly rustfmt further
      # down. 1.99.1 is the version `@stable` resolved to on 2026-11-12.
      #
      # `components: clippy` is load-bearing, not decoration. The first attempt at
      # unmasking the clippy step (run 43201274175) failed with "'cargo-clippy' is
      # not installed for the toolchain '1.99.1-x86_64-unknown-linux-gnu'": the
      # floating `@stable` form brought clippy implicitly, and overriding
      # `toolchain:` installs only the minimal profile. Naming the component makes
      # the dependency explicit instead of inherited from an action default.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-zig
        with:
          version: "0.16.0"
          # Same pinned release and checksum as the `zig-fmt` job above.
          shasum: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
      # 2026-11-12: this step was advisory (`|| echo "::warning::"`), so a
      # formatting regression reported success. It now gates - and it gates with
      # the toolchain the config actually requires.
      #
      # `khostty-vt/rustfmt.toml` sets `ignore = ["src/ffi.rs"]`, which is an
      # unstable key: on stable rustfmt the ignore is dropped with a warning, so
      # the generated `ffi.rs` is reformatted and the check fails with 22 diffs.
      # That is the failure seen on run 43165882964 job Rust. It was a
      # stable-versus-nightly mismatch, not a formatting regression: the first
      # version of this gate measured with the local nightly and wrongly reported
      # exit 0. Pin the nightly by date so the gate cannot drift.
      - name: Install pinned nightly rustfmt (rustfmt.toml needs the unstable `ignore` key)
        run: rustup toolchain install nightly-2026-11-11 --profile minimal --component rustfmt
      - name: cargo fmt --check
        working-directory: khostty-vt
        run: cargo +nightly-2026-11-11 fmt --all -- --check
      - name: zig build -Demit-lib-vt (materialise the linked library)
        run: zig build -Demit-lib-vt
      # 2026-11-12: this step was `cargo clippy ... || echo "::warning::clippy
      # issues (advisory, unmeasured)"`, so it could not fail. It is measured now,
      # on the CI toolchain (clippy 0.1.99 / rustc 1.99.1) and cross-checked on
      # clippy 0.1.101 nightly: **0 diagnostics, exit 0**, in about 2 s, because
      # the crate has no dependencies. So it is a real gate instead of a warning
      # printer.
      #
      # That measurement was taken on a desk host and, the first time this step was
      # unmasked, CI failed on something the measurement could not contain:
      # `cargo-clippy` was not installed for the pinned toolchain (run
      # 43201274175). The lint result itself was right; the toolchain pin was
      # incomplete. Fixed in the `dtolnay/rust-toolchain` step above by naming
      # `components: clippy`.
      #
      # It runs AFTER the library build on purpose. `khostty-vt/tests/` and both
      # examples are gated on `#![cfg(ghostty_vt_linked)]`, and `build.rs` sets
      # that cfg only when it finds a prebuilt libghostty-vt. In the old order
      # `--all-targets` was therefore linting a subset: the 130 linked
      # integration tests and the example bodies were never compiled, the same
      # silent-underrun class this job's test-collection assertion exists to
      # catch.
      - name: cargo clippy
        working-directory: khostty-vt
        run: cargo clippy --all-targets -- -D warnings
      # `khostty-vt/tests/` is gated on `#![cfg(ghostty_vt_linked)]`, and
      # `build.rs` sets that cfg only when it finds a prebuilt libghostty-vt under
      # `../zig-out/lib`. Without the build above, the 130 integration tests
      # neither fail nor skip: they are not compiled at all, so the run is 65
      # tests and looks green. That silent underrun is why this job used to be
      # advisory. Prove the linked tests were really collected before trusting
      # the result.
      - name: assert the linked integration tests were collected
        working-directory: khostty-vt
        run: |
          set -euo pipefail
          cargo test --workspace -- --list > "$RUNNER_TEMP/rust-tests.txt"
          total=$(grep -c ': test$' "$RUNNER_TEMP/rust-tests.txt" || true)
          echo "collected Rust tests: $total"
          # 65 unit + 4 doc-tests + 130 linked integration tests = 199. Without
          # libghostty-vt the 130 are never compiled, so the total lands near 69;
          # the floor sits well below the real figure and well above that
          # underrun, and does not pin an exact count that new tests would break.
          if [ "$total" -lt 190 ]; then
            echo "::error::only $total Rust tests were collected (expected 199). build.rs did not find libghostty-vt, so the 130 linked integration tests were compiled out instead of run."
            exit 1
          fi
      - name: cargo test
        working-directory: khostty-vt
        run: cargo test --workspace --no-fail-fast

  # The generated Rust binding must match the C headers.
  #
  # REQUIRED, and deliberately NOT advisory. The `rust` job blocks now, but the
  # history is why this check exists. While that job was
  # `continue-on-error: true` and wrapped `cargo test` in
  # `|| echo "::warning::test failures (advisory)"`, a stale binding could not
  # fail CI there - and it did not. khostty-vt 0.1.0 shipped with
  # `src/ffi.rs` stale against `include/`: 198 functions / 179 types /
  # 794 constants versus 199 / 196 / 884 after regeneration, with
  # `ghostty_osc_set` (include/ghostty/vt/osc.h:330) absent from the binding
  # entirely. `cargo test --test ffi_coverage` does catch this, but only when
  # the library has been built; this check catches it without any of that.
  #
  # This check needs only Python 3 and the source headers: no Zig build, no
  # Rust toolchain, no linked library. It runs in about two seconds, so there
  # is no reason for it to be advisory.
  binding-freshness:
    name: Rust binding freshness
    # REQUIRED, deliberately not advisory. Historically the `rust` job was
    # `continue-on-error: true` and wrapped `cargo test` in
    # `|| echo "::warning::..."`, so a stale binding could not fail CI there -
    # and it did not: khostty-vt 0.1.0 shipped with src/ffi.rs stale against
    # include/ (198/179/794 versus 199/196/884 after regeneration, with
    # ghostty_osc_set in include/ghostty/vt/osc.h:330 absent entirely). The rust
    # job blocks now, but this check stays because it needs only Python 3 and
    # the source headers: no Zig build, no Rust toolchain, ~2 s.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: gen_ffi.py --check
        working-directory: khostty-vt
        run: |
          set -euo pipefail
          python3 tools/gen_ffi.py --check

  # NOTE: the consolidated wasm header check is NOT duplicated here.
  #
  # `wasm/tools/gen-consolidated-header.mjs` shells out to `zig` to preprocess
  # the umbrella header, so the check needs a Zig toolchain. This workflow has
  # no Zig install, and adding one for a two-second check would be the wrong
  # trade. The check runs in `zig-fork-tests.yml` instead, as part of the
  # `wasm-abi` job's `npm run check`, next to the Zig install it already needs.
  # That workflow's `pull_request.paths` covers `include/**` and `wasm/**`,
  # which is what makes the generated artifacts stale in the first place.

  # Workflow YAML is code and nothing was checking it.
  #
  # Adding this gate immediately found two real defects: sonar.yml gated its
  # job on `env.SONAR_TOKEN_PRESENT`, but `env` is not a permitted context in a
  # job-level `if` (permitted: github, inputs, needs, vars), so the job skipped
  # unconditionally and adding SONAR_TOKEN would have silently done nothing;
  # and ci.yml's `detect` step echoed `steps.detect.outputs.*` from inside the
  # very step that sets them, so the summary was always blank.
  #
  # Scope is the FORK-MAINTAINED workflows only. The inherited upstream files
  # carry 165 findings purely because they target Ghostty's Namespace Cloud
  # runners; actionlint cannot know those labels, and remediating upstream's
  # infrastructure is not this fork's problem.
  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install actionlint
        run: |
          set -euo pipefail
          version="1.7.7"
          # sha256 of actionlint_1.7.7_linux_amd64.tar.gz, verified locally.
          sha256="023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          echo "${sha256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint --version
      - name: actionlint (fork-maintained workflows)
        run: |
          set -euo pipefail
          ./actionlint \
            .github/workflows/ci.yml \
            .github/workflows/zig-fork-tests.yml \
            .github/workflows/trunk-check.yml \
            .github/workflows/sonar.yml \
            .github/workflows/go-windows.yml \
            .github/workflows/clean-artifacts.yml \
            .github/workflows/milestone.yml
      # actionlint proves the workflow YAML is valid; it cannot tell you whether a
      # step is capable of failing. Every gate repaired in the 2026-11-12 arc was
      # syntactically perfect while masked, which is why this second check exists.
      # It asserts the two mask idioms are absent (except at two documented,
      # allowlisted sites) and that each repaired gate's exact command is still
      # present, so dropping `--all-targets` or `-- -D warnings` fails here.
      - name: no inert CI gates
        run: bash tools/check-gate-masks.sh

  cargo-deny:
    # 2026-11-12: until this commit the job supplied no supply-chain signal: it
    # was skipped on every run AND carried `continue-on-error`. `has_deny` is only
    # set by the detect job when a `deny.toml` exists, and this tree had none
    # (verified: `git ls-files | grep -i deny` is empty), so the `if:` was always
    # false and nothing downstream could ever observe it.
    #
    # `khostty-vt/deny.toml` now exists, so the job runs and gates: advisories,
    # licences, bans and sources. The allow list there is the licence set measured
    # from `cargo metadata --all-features` (24 dependency packages, all
    # permissive), with no `ignore` entries and `wildcards`/`unknown-registry` /
    # `unknown-git` denied.
    #
    # Measured before removing `continue-on-error`, with cargo-deny 0.20.2 (the
    # version pinned below) and rustc 1.99.1:
    # `cargo deny --manifest-path khostty-vt/Cargo.toml check` ->
    # "advisories ok, bans ok, licenses ok, sources ok", exit 0, zero warnings.
    name: Cargo Deny (Advisories + Licenses)
    needs: detect
    if: needs.detect.outputs.has_deny == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Pinned for the same reason as the `rust` job: `cargo metadata` output
          # and dependency resolution should not change under the gate without a
          # commit behind it.
          toolchain: "1.99.1"
      # Pinned by version rather than by action tag: cargo-deny's rule set and its
      # deny.toml schema both move between releases, so a floating install would
      # let the gate change without a commit. 0.20.2 is the version measured
      # above.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny check
        run: |
          set -euo pipefail
          cargo deny --manifest-path khostty-vt/Cargo.toml check

  python:
    # 2026-11-12: this job is now blocking. Until this commit it was
    # `continue-on-error: true` with a `|| echo "::warning::"` on each step, so it
    # reported success on every run whether or not ruff passed; the measured truth
    # was exit 1 on both steps.
    #
    # What the cleanup actually had to fix, measured before any code changed:
    # `ruff check .` reported 131 errors with ruff 0.16.7, but 85 of them were in
    # `vendor/nerd-fonts/font-patcher.py` and 11 in the generated
    # `src/font/nerd_font_codepoint_tables.py`. Neither is ours to edit, and
    # neither had ever been a deliberate linting target - they were only in scope
    # because the repository-level Python had no ruff configuration at all, so it
    # inherited whatever ruff's defaults happened to be. Ruff 0.16 widened those
    # defaults well past the old `E4/E7/E9/F` core, which is why the count jumped
    # without a line of Python changing. `ruff.toml` now selects rules explicitly
    # and excludes those two paths, at which point 33 first-party findings
    # remained: 32 fixed in code, one allowlisted on its own line (`S307`, the
    # single `eval` in the codegen, whose globals are an allowlist and whose
    # input is an unparsed AST) with the reason written next to it. The ignore
    # list was also audited for inert entries: BLE001, EXE001 and T201 were
    # removed because none of BLE/EXE/T is selected here, so they suppressed
    # nothing and only made the profile look stricter than it was.
    #
    # The version is pinned for the same reason: an unpinned `pip install ruff`
    # means the gate's ruleset changes without a commit.
    name: Python
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.16.7
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  pytest:
    name: Python Tests
    needs: detect
    # 2026-10-15: this previously read `has_python_tests`, which the detect
    # job never exported. The job's `if:` then evaluated to a missing/empty
    # value, GitHub treated that as a skip, and the pytest job silently
    # reported "skipped" on every push (real run 38824904579 on the final
    # SHA de6971085 is the smoking gun: conclusion "success", but the
    # "Python Tests" job is "skipped"). The detect step sets `has_python`,
    # not `has_python_tests`; this guard now references the actual output.
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The bindings open the library with dlopen. khostty_vt/_ffi.py searches
      # `../../zig-out/lib` and `../zig-out/lib` for libghostty-vt.{dylib,so},
      # so the native library has to exist before anything can be collected.
      # Without it every test errors at import time instead of reporting a
      # real failure.
      - uses: ./.github/actions/install-zig
        with:
          version: "0.16.0"
          # install-zig refuses to proceed without a 64-char lowercase hex
          # SHA-256 (action.yml enforces `^[0-9a-f]{64}$`). The shasum is the
          # ziglang.org-published value for zig-x86_64-linux-0.16.0.tar.xz
          # (from https://ziglang.org/download/index.json key
          # 0.16.0.x86_64-linux.shasum, captured 2026-10-15).
          shasum: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
      - name: Build libghostty-vt
        run: zig build -Dapp-runtime=none

      # cffi, pytest, and setuptools are all hash-pinned in requirements-ci.txt
      # (covers Sonar S8541/S8544). The first command installs the test
      # dependencies the project declares in `optional-dependencies.test` plus
      # the cffi runtime dep declared in `dependencies`, every line with
      # `--require-hashes --only-binary :all:` for reproducibility. The second
      # command installs the local package in editable mode; pip uses default
      # build isolation (setuptools is in requirements-ci.txt) and resolves
      # cffi from the already-installed copy. No `--no-deps` (cffi would be
      # missing on a clean machine) and no `--no-build-isolation` flag — the
      # prior combination was fragile and contradicted the "use the declared
      # project test extra" directive.
      - name: Install package and test dependencies
        run: |
          pip install --require-hashes --only-binary :all: -r khostty-python/requirements-ci.txt
          pip install -e khostty-python

      - name: pytest
        working-directory: khostty-python
        run: python -m pytest tests/ -q

  go:
    name: Go
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    # This job used to be decorative three times over: `continue-on-error: true`,
    # a `|| echo "::warning::..."` on every step, and the part that mattered:
    # every command ran at the repository root. The only Go module is
    # `khostty-go/go.mod`, so `go test ./...` failed outright there with
    #
    #     pattern ./...: directory prefix . does not contain main module or its
    #     selected dependencies        (exit status 1, reproduced 2026-11-11)
    #
    # and the `|| echo` turned that exit 1 into a green job. The Linux Go gate
    # therefore executed zero tests and could not detect even a compile error.
    # `go-windows.yml` is the only real Go gate, and it is Windows-only. The
    # three things that made it work there are mirrored here: the module
    # directory as the working directory, a built `libghostty-vt` (the cgo
    # linker names it explicitly, so `go test` cannot link without it), and exit
    # codes that are allowed to fail the step.
    defaults:
      run:
        working-directory: khostty-go
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-zig
        with:
          version: "0.16.0"
          # Same ziglang.org-published shasum for zig-x86_64-linux-0.16.0.tar.xz
          # used by the Python job above; the archive is the same one.
          shasum: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.3"
          cache: false
      # `khostty-go` links `-lghostty-vt` against `../zig-out/lib`, so the
      # library has to exist before any Go command can link. `-Dapp-runtime=none`
      # is the same invocation the Python job uses and is the cheaper of the two
      # (the Windows job asks for `-Demit-lib-vt -Doptimize=ReleaseFast`).
      - name: Build libghostty-vt
        working-directory: .
        run: zig build -Dapp-runtime=none
      - name: gofmt check
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed for:"
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: |
          set -euo pipefail
          # `tee` so the log survives for the guard below. `pipefail` (not a
          # `|| echo`) is what carries a real test failure out of this step.
          go test -count=1 -v ./... | tee "$RUNNER_TEMP/go-test.log"
          # A green `go test` that ran no tests is exactly the failure mode this
          # job previously shipped. 45 top-level tests (75 including subtests)
          # exist today; require evidence of at least one rather than pinning 45,
          # the same way `zig-fork-tests.yml` requires a `run test N pass` line.
          if ! grep -q '^=== RUN' "$RUNNER_TEMP/go-test.log"; then
            echo "::error::go test reported success but ran zero tests"
            exit 1
          fi
          echo "ran $(grep -c '^=== RUN   [^/]*$' "$RUNNER_TEMP/go-test.log") top-level tests"

  typescript:
    name: TS/JS
    needs: detect
    if: needs.detect.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    # The TS project is wasm/, not the repo root: the root has no package.json
    # and no lockfile exists anywhere in the tree (verified 2026-10-01), so
    # setup-node's `cache: 'npm'` hard-failed with "Dependencies lock file is
    # not found in /home/runner/work/Khostty/Khostty" in run 36628566922.
    defaults:
      run:
        working-directory: wasm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # No `cache:` input: npm caching requires a lockfile and wasm/ has none.
          # Committing one is a separate decision; until then this job installs fresh.
      - run: npm install --no-audit --no-fund
      # `wasm/package.json` declares no `lint` script (verified 2026-11-12: the
      # scripts are build, test, test:header, typecheck, check, exports), so the
      # old `grep -q '"lint"'` guard was always false and this step reported
      # success having run nothing. Gate on the check that does exist.
      - name: typecheck
        run: npm run typecheck
      # NO `npm test` HERE, deliberately. This job cannot run it, and saying so
      # is the point of this file.
      #
      # `npm test` is `node --test test/*.test.mjs`, and those tests load
      # `wasm/khostty-vt.wasm`, which is gitignored and therefore absent on a
      # fresh checkout. Measured on run 43165882964 job TS/JS: every test failed
      # with "missing .../wasm/khostty-vt.wasm; build it with: wasm/build.sh"
      # (`hookFailed`), which cancelled the rest. A second, independent blocker:
      # `test/smoke.test.mjs` uses `await using` (Explicit Resource Management),
      # which Node 24 is the first release to parse, while this job pins Node 20
      # for the typecheck. The step could not pass for two separate reasons, and
      # `continue-on-error` is why nobody noticed.
      #
      # Two jobs already build the artifact and run this exact suite with a Node
      # that can parse it, so a third copy here would be a third build of the
      # same 854 KB module and a third place to rot:
      #   * `zig-fork-tests.yml` / `wasm ABI + data table` - builds it and runs
      #     the full `npm run check` (node 24) on EVERY pull request: that
      #     workflow's `pull_request` trigger has no `paths` filter at all.
      #   * `ci-conformance.yml` / `wasm` - builds it and runs the 54 tests
      #     (node 24) on `wasm/**`, `include/**` and `src/**`.
      # So removing this step loses no coverage on a PR; it removes a
      # permanently-red duplicate.
      # A green TS/JS tick therefore means "the TypeScript declarations compile",
      # which is a real gate that can fail, and not "the wasm tests ran".

  security:
    name: Security Scan
    needs: detect
    if: needs.detect.outputs.has_security == 'true'
    runs-on: ubuntu-latest
    # 2026-11-12: `continue-on-error: true` was here, so a leak reported success.
    # The gitleaks step has concluded success on every completed run observed
    # (step-level, which continue-on-error does not mask), so it now gates.
    steps:
      - uses: actions/checkout@v4
        with:
          # 2026-10-15: gitleaks-action resolves its diff range as
          # `<head>^..<head>`. The default shallow clone (depth 1) does not
          # contain the parent commit, so git failed with
          # "fatal: ambiguous argument" and the scan degraded to a partial
          # 0-byte scan (it reported "no leaks found" -- that was a failed
          # scan, not a clean one). Fetch full history so the range resolves.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dep-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # 2026-11-12: `continue-on-error: true` removed. The dependency-review step
    # concluded success on the last completed run, so this now gates PRs.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: low

  lint:
    name: ci / lint
    if: always()
    needs:
      [
        zig-fmt,
        detect,
        actionlint,
        rust,
        cargo-deny,
        python,
        go,
        typescript,
        security,
        dep-review,
        pytest,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate lint gate
        run: |
          failed=0
          for pair in \
            "zig-fmt:${{ needs.zig-fmt.result }}" \
            "actionlint:${{ needs.actionlint.result }}" \
            "rust:${{ needs.rust.result }}" \
            "cargo-deny:${{ needs.cargo-deny.result }}" \
            "python:${{ needs.python.result }}" \
            "go:${{ needs.go.result }}" \
            "typescript:${{ needs.typescript.result }}" \
            "security:${{ needs.security.result }}" \
            "dep-review:${{ needs.dep-review.result }}" \
            "pytest:${{ needs.pytest.result }}" \
            ; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "  ✗ $name: $result"
              failed=$((failed + 1))
            elif [ "$result" = "success" ] || [ "$result" = "skipped" ]; then
              echo "  ✓ $name: $result"
            else
              echo "  ? $name: $result"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo ""
            echo "❌ $failed lint check(s) failed"
            exit 1
          fi
          echo ""
          echo "✅ All lint checks passed (or were skipped)"

  test:
    # The job id stays `test` so existing `needs:` references keep working. The
    # DISPLAY name is what branch protection keys on, and `ci / test` wrongly
    # implied the Zig suite ran here: this job aggregates `lint` (which fans out
    # to rust, go, python, typescript, security, dep-review, cargo-deny, zig-fmt
    # and, since 2026-11-12, actionlint) and `pytest`. Nothing here runs Zig. Renaming it is issue #111 part 2, and
    # it must be swapped in `required_status_checks.contexts` in the SAME window
    # as this rename or every PR blocks on a check that never reports.
    name: ci / aggregate
    if: always()
    needs: [lint, pytest]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate test gate
        run: |
          # Real test gate: a pytest regression must propagate here. The prior
          # body was an empty stub that echoed a fixed success string; it
          # asserted nothing and silently masked every failure.
          failed=0
          for pair in \
            "lint:${{ needs.lint.result }}" \
            "pytest:${{ needs.pytest.result }}" \
            ; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "  ✗ $name: $result"
              failed=$((failed + 1))
            elif [ "$result" = "success" ] || [ "$result" = "skipped" ]; then
              echo "  ✓ $name: $result"
            else
              echo "  ? $name: $result"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo ""
            echo "❌ $failed test gate(s) failed"
            exit 1
          fi
          echo ""
          echo "✅ All aggregate gates passed (lint + pytest); Zig gates run in Fork Zig Tests"
