# =============================================================================
# GTK runtime build - the ONLY place the agent-IPC windowed path is compiled
# =============================================================================
# `windowed` in src/apprt/ipc/app_host.zig:71-77 is true only for
# (artifact == .exe && app_runtime == .gtk). Every other build, including every
# macOS build, discards the windowed vtable at comptime - so the 7,230-LOC
# agent IPC surface compiles and tests green while nothing ever type-checks the
# code path that would serve an agent.
#
# Separate workflow on purpose: while it lives inside zig-fork-tests.yml its
# failure log is only published when the whole run finishes, and the
# test-agent-ipc job in that workflow takes ~17 minutes. Here the whole run is
# a few minutes, so the log is available almost immediately - which is the
# difference between a 4-minute and a 20-minute edit/test loop.
# =============================================================================

name: GTK Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gtk-build.yml"
      - "src/apprt/gtk/**"
      - "src/apprt/ipc/**"
      - "src/build/**"
      - "include/**"
      - "build.zig"
      - "flake.nix"
      - "nix/**"
  pull_request:
    paths:
      - ".github/workflows/gtk-build.yml"
      - "src/apprt/gtk/**"
      - "src/apprt/ipc/**"
      - "src/build/**"
      - "include/**"
      - "build.zig"
      - "flake.nix"
      - "nix/**"
  workflow_dispatch:

concurrency:
  group: gtk-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gtk-build:
    name: GTK runtime build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # THE job that matters for agent IPC.
    #
    # `windowed` in src/apprt/ipc/app_host.zig:71-77 is true ONLY for
    # (artifact == .exe && app_runtime == .gtk). Every other build - including
    # every macOS build - discards the windowed vtable at comptime, so the
    # 7,230-LOC IPC surface compiles and tests green while nothing ever
    # type-checks the code path that would actually serve an agent. That is how
    # it sat dormant: not broken, just never compiled.
    #
    # This job is the only place that compiles it. Without it, B1 (binding the
    # server from the GTK runtime) cannot be verified anywhere.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GTK4 build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # Mirrors nix/devShell.nix. libgtk4-layer-shell-dev is not packaged on
          # every Ubuntu release, so it is installed opportunistically.
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-4-dev libadwaita-1-dev blueprint-compiler \
            libonig-dev libxml2-dev libglib2.0-dev \
            libharfbuzz-dev libfontconfig1-dev \
            libwayland-dev wayland-protocols libx11-dev
          # msgfmt: the build runs the i18n step, which needs gettext.
          sudo apt-get install -y --no-install-recommends gettext
          sudo apt-get install -y --no-install-recommends libgtk4-layer-shell-dev || true
      - uses: ./.github/actions/install-zig
        with:
          version: "0.16.0"
          shasum: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
      - name: Build with the GTK runtime
        run: zig build -Dapp-runtime=gtk
