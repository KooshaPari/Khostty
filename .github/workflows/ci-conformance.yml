# =============================================================================
# Conformance + WASM tests for the fork-only build steps
# =============================================================================
# Khostty adds two build steps that are not exercised by zig-fork-tests.yml:
#
#   1. Conformance (`./conformance/build.sh run`)
#        Cross-language black-box tests that prove the IPC wire protocol
#        behaves correctly under a hostile/probing client. Reads
#        `conformance/spec/` and exercises the server with structured
#        request/response fixtures.
#
#   2. WASM (`./wasm/build.sh` + `./wasm/test/*.test.mjs`)
#        Compiles a JS/TS client to WASM and runs the resulting test bundle
#        with `node --test`. Proves the wire format round-trips through the
#        same serializer a browser-side client would use.
#
# Why push-on-main (not nightly):
#   These tests are the contract for the wire format. A regression on the
#   push path means a future merge ships a wire-breaking change. The cost
#   is bounded: ~3 min cold, ~30s warm. Worth paying every push.
#
# Why `pull_request` as well as push-on-main:
#   The original rationale was that a single-owner fork only needs the gate to
#   be loud on main, and that authors can run it locally before pushing. That
#   is exactly what went wrong: this workflow was red on main and nobody knew,
#   because nothing ran it before the merge that made it red. It now runs on
#   PRs that touch the same paths, so the fix for a red gate can be proven
#   before it lands rather than after.
#
# Why filter to conformance/, wasm/, src/:
#   This workflow should not re-run for changes to docs, fonts, locales, or
#   the editor demo. None of those touch the wire or the wasm build.
# =============================================================================

name: Conformance + WASM

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci-conformance.yml"
      - "conformance/**"
      - "wasm/**"
      - "src/**"
  # A gate that only runs after merge cannot prevent a broken merge, and this
  # one proved it: it was red on main for weeks (the `conformance` job aborted
  # in 0.01 s, and the `wasm` job could not parse the test source on the
  # runner's Node), while every PR's required-check view stayed green. Same
  # path filter as the push trigger, so the cost is bounded to the PRs that
  # actually touch the wire or the wasm build.
  pull_request:
    paths:
      - ".github/workflows/ci-conformance.yml"
      - "conformance/**"
      - "wasm/**"
      - "src/**"
  workflow_dispatch:

concurrency:
  group: ci-conformance
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-zig
        with:
          version: "0.16.0"
          # See zig-fork-tests.yml for the source of this SHA-256.
          shasum: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # Build the IPC server binary first so the conformance run can spawn
      # it as a black-box child. The same build target is what an external
      # integration test would link against.
      - name: Build agent-ipc
        run: nix develop -c zig build -Demit-lib-vt
      - name: Run conformance
        run: ./conformance/build.sh run

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The test bundle uses `await using` (Explicit Resource Management),
      # which Node 24 is the first release to parse. The runner's default Node
      # is 22, where every `await using` is a SyntaxError, so the version has
      # to be pinned here rather than inherited. Pinned by SHA because the
      # repo's Sonar gate flags actions referenced by tag.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: ./.github/actions/install-zig
        with:
          version: "0.16.0"
          shasum: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build wasm
        run: ./wasm/build.sh
      - name: Run wasm tests
        # `for f in ./wasm/test/*.test.mjs; do node --test $f; done` mirrors
        # the local dev loop and keeps the failure output in the per-file
        # order rather than as a single node --test --test-name-pattern run.
        run: |
          node --version
          for f in ./wasm/test/*.test.mjs; do
            node --test "$f"
          done
