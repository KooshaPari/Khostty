# Description:
#   - Add milestone to a merged PR automatically
#   - Add milestone to a closed issue that has a merged PR fix (if any)

name: Milestone Action
on:
  issues:
    types: [closed]
  pull_request_target:
    types: [closed]

jobs:
  update-milestone:
    # Ignore bot-authored pull requests (dependabot, app bots, etc)
    # and CI-only PRs.
    if: github.event_name == 'issues' || (github.event.pull_request.user.type != 'Bot' && !startsWith(github.event.pull_request.title, 'ci:'))
    # FORK: was `namespace-profile-ghostty-sm` (upstream Ghostty's
    # Namespace Cloud runner, absent here), so this never executed - history
    # was 1 skipped and 4 cancelled. The job only uses
    # `hustcer/milestone-action`, which is runner-agnostic, so ubuntu-latest
    # makes it actually work.
    runs-on: ubuntu-latest
    name: Milestone Update
    steps:
      # FORK: this repository has zero milestones (0 open, 0 closed, measured
      # 2026-11-10). `hustcer/milestone-action` then falls back to date-based
      # detection, finds nothing, and exits 8:
      #
      #   Using date-based milestone detection for PR #88...
      #   No open milestones found.
      #   ##[error]Process completed with exit code 8.
      #
      # That makes `Milestone Update` fail on every merged PR in this fork. The
      # check does not gate merging, but it turns every merge into a red run,
      # which is how a real failure would hide. Pre-check for an open milestone
      # and skip the binding steps when there is none, rather than blanket
      # `continue-on-error`, so genuine action errors stay visible.
      - name: Check for open milestones
        id: milestones
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          count=$(gh api \
            "repos/${GITHUB_REPOSITORY}/milestones?state=open&per_page=1" \
            --jq 'length')
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "open milestones: ${count}"

      - name: Set Milestone for PR
        uses: hustcer/milestone-action@2f38355153344ccaaa44b5b5fcff9f604dff1b45 # v3.2
        if: steps.milestones.outputs.count != '0' && github.event.pull_request.merged == true && !contains(github.event.pull_request.title, 'VOUCHED') && !startsWith(github.event.pull_request.title, 'ci:')
        with:
          action: bind-pr # `bind-pr` is the default action
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Bind milestone to closed issue that has a merged PR fix
      - name: Set Milestone for Issue
        uses: hustcer/milestone-action@2f38355153344ccaaa44b5b5fcff9f604dff1b45 # v3.2
        if: steps.milestones.outputs.count != '0' && github.event.issue.state == 'closed'
        with:
          action: bind-issue
          github-token: ${{ secrets.GITHUB_TOKEN }}
