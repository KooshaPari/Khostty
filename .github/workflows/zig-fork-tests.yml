# =============================================================================
# Zig tests for the fork-only build steps
# =============================================================================
# Khostty adds two build steps that do not exist upstream:
#
#   test-windows-apprt  src/main_windows_apprt.zig  (Windows app runtime)
#   test-agent-ipc      src/main_agent_ipc.zig      (agent IPC mux substrate)
#
# Neither was referenced by ANY workflow, so the 156 `test` declarations across
# those two files had never executed in CI. They only ran when a human typed
# `zig build test-agent-ipc` by hand — which is why Phase 0 verification
# required ~27 minutes of local wall-clock and a hand-written evidence log.
#
# The inherited upstream `test.yml` CANNOT run on this fork: every job is
# pinned to a Namespace Cloud runner profile this fork does not have, and the
# Linux `test` job's `if:` requires github.repository == 'ghostty-org/ghostty'
# (see 2d860e921, which moved it to workflow_dispatch only because it was
# unschedulable by construction). So `zig build test` ran in NO CI job until
# Issue #98 added the `zig-test` job below. `test-lib-vt` is covered by the
# `khostty-vt/` path gate on the fork-only steps.
#
# Why nightly rather than per-push:
#   `test-agent-ipc` runs the full test tree (~3900 tests, ~4GB peak, ~27min
#   warm). Running that on every push would dominate CI cost for a repo on the
#   free Actions tier. The fork's own conventions already schedule heavier
#   work off the push path (sonar.yml, trunk-check.yml, scorecard.yml all use
#   weekly crons). This matches that pattern.
# =============================================================================

name: Fork Zig Tests

on:
  schedule:
    # Daily 05:20 UTC — deliberately offset from the Monday 03:00/04:00/04:25
    # weekly cluster so this does not compete for runners with trunk-check,
    # sonar, or scorecard.
    - cron: "20 5 * * *"
  workflow_dispatch:
  # 2026-10-15: narrowly-scoped `pull_request` trigger added so the workflow
  # is observable on the PR head SHA before merge (the default-branch
  # scheduler and workflow_dispatch API cannot see a workflow file that
  # lives only on a non-default branch). Scope: the workflow file itself,
  # the two fork-only test entry points, the directories and shared imports they
  # transitively pull in (incl. src/App.zig + src/Surface.zig), and build.zig (build-config changes can break
  # these tests). Since Issue #98 this workflow is the ONLY CI channel for the
  # Zig suite: `test.yml` cannot run on this fork (its jobs are pinned to
  # namespace-profile runners this fork cannot schedule, and the Linux `test`
  # job carries the upstream `github.repository == 'ghostty-org/ghostty'
  # guard), so it does NOT cover `zig build test` / `test-lib-vt` "for all
  # other changes" - nothing else covers them at all. `src/**` and
  # `build.zig.zon` are what keep this gate broad enough to matter, because the
  # core suite exercises all of src/, not just the entries listed above.
  # Intended to remain as a
  # validation channel pre- and post-merge; the long-term nightly
  # schedule stays for catch-up coverage on slow PRs.
  pull_request:
    paths:
      - ".github/workflows/zig-fork-tests.yml"
      - "src/main_windows_apprt.zig"
      - "src/main_agent_ipc.zig"
      - "src/apprt/windows/**"
      - "src/apprt/ipc/**"
      - "src/App.zig"
      - "src/Surface.zig"
      - "build.zig"
      # The generated artifacts (khostty-vt/src/ffi.rs,
      # wasm/include/ghostty-vt.h, wasm/js/terminal-data.js) are derived from
      # include/ghostty/, so a header change is what makes them stale.
      - "include/**"
      - "wasm/**"
      - "khostty-vt/**"
      # GTK runtime: the only app_runtime for which `windowed` is true, so the
      # only place B1 (bind the IPC server from the runtime) can be verified.
      - "src/apprt/gtk/**"
      - "src/build/**"
      # Issue #98: the core Zig suite (`zig build test`) exercises all of src/,
      # not only the entries above. `src/**` and `build.zig.zon` close the gap
      # (the narrower src/ entries above are now redundant but harmless).
      - "src/**"
      - "build.zig.zon"
      - "flake.nix"
      - "nix/**"
  # Keep `merge_group` out of the trigger list for now: this fork's
  # default branch is not configured for merge queues, and an
  # unhandled event type silently swallows the trigger.

concurrency:
  # Per-ref, NOT a single global group. The previous `group: zig-fork-tests`
  # put every branch in one group, so a run on any branch cancelled the run on
  # every other branch: re-running one PR silently killed another PR's build.
  # Observed directly - a GTK build and a test-agent-ipc run destroyed each
  # other twice. `cancel-in-progress` is still wanted, but only for the same
  # ref, where a newer push genuinely supersedes an older run.
  group: zig-fork-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-apprt:
    name: test-windows-apprt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 2026-10-15: removed `continue-on-error: true`. The cheap windows-apprt
    # job (1-3 min warm) is a real gate; a regression here MUST surface as
    # a push-blocking failure, not a silent nightly red X. The earlier
    # `continue-on-error` masked every failure through the schedule path
    # (operator directive: "remove masks for real test failures"). The
    # agent-ipc job is no longer masked either; the 60-min cost is offset
    # by the nightly schedule and the workflow_dispatch manual path.
    steps:
      - uses: actions/checkout@v4
        with:
          # The step resolves its dependency tree from the default branch, so a
          # shallow clone would silently change what gets tested.
          fetch-depth: 0
      - uses: ./.github/actions/install-zig
        with:
          version: "0.16.0"
          # install-zig refuses to proceed without a 64-char lowercase hex
          # SHA-256 (action.yml enforces `^[0-9a-f]{64}$`). The shasum is the
          # ziglang.org-published value for zig-x86_64-linux-0.16.0.tar.xz
          # (from https://ziglang.org/download/index.json key
          # 0.16.0.x86_64-linux.shasum, captured 2026-10-15). Without this
          # the regex check kills the step and the job is skipped.
          shasum: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # No `cachix-action` step: this fork has no CACHIX_AUTH_TOKEN
          # secret, and the cachix-action without credentials 401s. Nix
          # itself is enough; flake.nix is the only thing the build
          # actually needs (it supplies GTK4 / libadwaita / oniguruma /
          # libxml2 / glib / pkg-config that the imported apprt/windows
          # modules transitively link against).
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run test-windows-apprt
        run: nix develop -c zig build test-windows-apprt

  agent-ipc:
    name: test-agent-ipc
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 2026-10-15: removed `continue-on-error: true` (operator directive).
    # The 60-min cost is the reason this whole workflow is cron+manual only;
    # within those triggers a real regression is the signal we want.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-zig
        with:
          version: "0.16.0"
          shasum: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run test-agent-ipc
        run: nix develop -c zig build test-agent-ipc

  # Issue #98: the inherited upstream `test.yml` cannot run on this fork. Its
  # jobs are pinned to `namespace-profile-ghostty-*` Namespace Cloud runners
  # this fork cannot schedule, and the Linux `test` job also carries
  # `if: github.repository == 'ghostty-org/ghostty'`. Commit 2d860e921 moved it
  # to `workflow_dispatch` only precisely because those jobs are unschedulable
  # by construction. Net effect: `zig build test` - the main Zig suite - ran in
  # NO CI job on this fork. This job is that suite, on the only runner class
  # this fork can schedule.
  #
  # `-Dapp-runtime=none` matches what test.yml's Linux `test` job runs
  # (test.yml:1495). Without it the build pulls the GTK app runtime, which the
  # core suite does not need and which adds build time on ubuntu-latest.
  #
  # timeout-minutes: 60, not 30. This workflow has no cache step (no
  # CACHIX_AUTH_TOKEN secret exists on the fork, so cachix-action would 401),
  # so every run re-fetches the Nix closure and recompiles Zig cold. A warm
  # M-series laptop reference is ~27 min for a comparable suite; a cold
  # ubuntu-latest run is plausibly 25-40 min. 60 is the honest ceiling.
  #
  # Blocking on purpose: no `continue-on-error`, no test-level retries. A red
  # Zig suite must surface as a failure, not a silent nightly red X.
  zig-test:
    name: test (zig build test)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-zig
        with:
          version: "0.16.0"
          shasum: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # Same as the jobs above: no cachix-action, this fork has no
          # CACHIX_AUTH_TOKEN. flake.nix supplies every system dependency the
          # suite needs, so `nix develop -c` IS the dependency install step.
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run zig build test
        # `--summary all` is load-bearing, not decoration: `zig build test`
        # prints NOTHING when it passes, so without this flag a green job is
        # indistinguishable from a job that ran no tests. With it the log
        # carries `Build Summary: N/N steps succeeded; M/M tests passed`,
        # which is the only evidence a reviewer or a future reader can check.
        run: nix develop -c zig build -Dapp-runtime=none test --summary all

  wasm-abi:
    name: wasm ABI + data table
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Third and last member of the generated-artifact drift class. The two
    # cheap gates in ci.yml (`binding-freshness`, `wasm-header-freshness`) need
    # no Zig build, but they cannot see two things:
    #
    #   * wasm/js/terminal-data.js is generated from include/ghostty/vt/
    #     terminal.h and was stale by two members (MOUSE_SHAPE 41,
    #     MEMORY_USAGE 42);
    #   * whether the built module actually exports what the headers declare.
    #
    # Both need a real wasm32-freestanding module, so this job builds one
    # (~1 min warm) and runs the full wasm check. Not masked: same operator
    # directive as the two jobs above.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/install-zig
        with:
          version: "0.16.0"
          shasum: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
      # Node 24, NOT 22. wasm/test/smoke.test.mjs uses `await using`
      # (Explicit Resource Management), which lands unflagged in Node 24.
      # Node 22 fails at parse time with
      #   SyntaxError: Unexpected identifier 'term'
      # and the file aborts before its assertions, so the suite silently runs
      # 20 tests instead of 54. Verified: node 24.22.0 and 26.12.0 both give
      # 54/54; node 22.23.3 fails.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build the wasm module
        run: ./wasm/build.sh
      - name: Header + data table + ABI + tests
        working-directory: wasm
        run: npm run check
