# =============================================================================
# Agent IPC runtime verification - proves the socket ANSWERS, not just builds
# =============================================================================
# The GTK Build workflow proves the windowed path compiles. That is a different
# claim from "an agent can talk to the app", and the fork spent a long time
# confusing the two: 7,230 LOC of agent IPC was green in tests while the socket
# was never created at all, because no runtime ever called `Server.bind`.
#
# This job launches the real GTK app under Xvfb, waits for the Unix socket to
# appear, and runs `ipc-probe`, which performs the same handshake a client does
# (`ping` then `pane.list`) and fails loudly if either is refused.
#
# Separate workflow for the same reason as `gtk-build.yml`: a few-minute run
# whose log is published immediately, instead of queueing behind the ~17-minute
# `test-agent-ipc` job.
#
# FORK: KooshaPari/Khostty#48 (Phase B1 verification).
# =============================================================================

name: IPC Runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ipc-runtime.yml"
      - "src/apprt/gtk/**"
      # Core files the windowed path compiles too. Without these a
      # change to Surface.zig or App.zig silently skipped the only
      # jobs that analyse the windowed code - the exact hole that let
      # the vtable rot unnoticed. KooshaPari/Khostty#48.
      - "src/Surface.zig"
      - "src/App.zig"
      - "src/apprt/ipc/**"
      - "src/ipc_probe.zig"
      - "src/build/**"
      - "build.zig"
      - "flake.nix"
      - "nix/**"
  pull_request:
    paths:
      - ".github/workflows/ipc-runtime.yml"
      - "src/apprt/gtk/**"
      # Core files the windowed path compiles too. Without these a
      # change to Surface.zig or App.zig silently skipped the only
      # jobs that analyse the windowed code - the exact hole that let
      # the vtable rot unnoticed. KooshaPari/Khostty#48.
      - "src/Surface.zig"
      - "src/App.zig"
      - "src/apprt/ipc/**"
      - "src/ipc_probe.zig"
      - "src/build/**"
      - "build.zig"
      - "flake.nix"
      - "nix/**"
  workflow_dispatch:

concurrency:
  group: ipc-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ipc-runtime:
    name: Agent IPC runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/install-zig
        with:
          version: "0.16.0"
          shasum: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the IPC app-thread boundary
        # `zig run`, not `zig build`: the build graph unpacks build.zig.zon
        # dependencies, which needs the dev shell. The guard only reads a
        # source file, so it needs no toolchain beyond zig itself.
        run: zig run tools/check-ipc-app-thread.zig -- src/apprt/ipc/app_host.zig

      - name: Build the GTK runtime and the IPC probe
        run: |
          set -euo pipefail
          # The probe compiles against src/apprt/ipc only - it needs no GTK -
          # but building it inside the dev shell keeps one toolchain in play.
          nix develop -c bash -c '
            set -euo pipefail
            zig build -Dapp-runtime=gtk
            # -lc is REQUIRED: auth.Env.process() falls back to noneGet when
            # libc is not linked, so without it the probe reads no environment
            # at all and reports KHOSTTY_IPC_SOCKET as unset.
            zig build-exe src/ipc_probe.zig -O ReleaseSafe -lc \
              -femit-bin=zig-out/bin/ipc-probe
          '

      - name: Launch the app and exercise the socket
        # The logic lives in nix/ipc-runtime-check.sh so it can be run locally
        # on any Linux box, and so this step stays inside `nix develop` where
        # `Xvfb` and GTK actually exist on PATH.
        #
        # BLOCKING. This check now passes end to end against a live app:
        # socket created, client connected, `ping ok (server=khostty)`, and
        # `pane.list ok (1 pane(s))` through the windowed vtable. It was briefly
        # `continue-on-error` while the GTK runtime could not initialise a
        # surface without an EGL driver - that turned out to be a missing
        # `__EGL_VENDOR_LIBRARY_FILENAMES` in the dev shell, fixed there.
        #
        # Note #65 is still open for the *product* case: a real host without
        # EGL still exits 0 silently. This job no longer hides that.
        run: nix develop -c bash nix/ipc-runtime-check.sh

      - name: Assert a failed startup exits non-zero
        # KooshaPari/Khostty#65. The runtime used to exit 0 when it could
        # never open a terminal (e.g. no EGL driver), which is
        # indistinguishable from a clean shutdown to a supervisor. This
        # breaks EGL deliberately and requires a non-zero exit.
        run: nix develop -c bash nix/ipc-exit-code-check.sh
