name: Pre-fetch zig dependencies
description: >
  Populate the zig global cache from build.zig.zon.txt before a build, with
  bounded retries per URL. Dependencies that are pre-seeded as content-addressed
  archives under seeds/ are copied into the cache without any network call, so a
  dead third-party host cannot starve the job. Zig still verifies the hash of
  whatever it loads, so a wrong or corrupt seed fails the build loudly instead
  of passing silently; a dependency without a seed still requires the network
  and still fails the job if it cannot be fetched. No failure path is weakened.

inputs:
  attempts:
    description: Total attempts per URL before failing.
    required: false
    default: "4"
  cache-dir:
    description: >
      Directory to use as ZIG_GLOBAL_CACHE_DIR. Empty means
      $RUNNER_TEMP/zig-global-cache.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Fetch build.zig.zon.txt into the zig global cache
      shell: bash
      env:
        ATTEMPTS: ${{ inputs.attempts }}
        CACHE_DIR: ${{ inputs.cache-dir }}
      run: |
        set -uo pipefail

        cache_dir="${CACHE_DIR:-${RUNNER_TEMP:-/tmp}/zig-global-cache}"
        mkdir -p "$cache_dir" "$cache_dir/p"
        export ZIG_GLOBAL_CACHE_DIR="$cache_dir"
        # Export for the build steps that follow: without this the fetched
        # packages exist but `zig build` still resolves against ~/.cache/zig
        # and goes back to the network.
        echo "ZIG_GLOBAL_CACHE_DIR=$ZIG_GLOBAL_CACHE_DIR" >> "$GITHUB_ENV"

        case "${ATTEMPTS}" in
          ''|*[!0-9]*|0) echo "::error::attempts must be a positive integer, got '${ATTEMPTS}'"; exit 1 ;;
        esac

        list="${GITHUB_WORKSPACE:-$PWD}/build.zig.zon.txt"
        if [ ! -f "$list" ]; then
          echo "::error::build.zig.zon.txt not found at $list"
          exit 1
        fi

        # Locate the seeds directory shipped next to this action.
        action_dir="${GITHUB_ACTION_PATH:-$(cd "$(dirname "$0")" && pwd)}"
        seeds_dir="$action_dir/seeds"
        seeded_count=0
        if [ -d "$seeds_dir" ]; then
          for seed in "$seeds_dir"/*.tar.gz; do
            [ -e "$seed" ] || continue
            seed_name="$(basename "$seed")"
            target="$cache_dir/p/$seed_name"
            if [ ! -f "$target" ]; then
              cp "$seed" "$target"
              seeded_count=$((seeded_count + 1))
            fi
          done
        fi
        if [ "$seeded_count" -gt 0 ]; then
          echo "Seeded $seeded_count archive(s) from $seeds_dir into $cache_dir/p"
        fi

        seeded_urls=0
        fetched_urls=0
        failed=0
        total=0
        while IFS= read -r url; do
          case "$url" in ''|'#'*) continue ;; esac
          total=$((total + 1))
          ok=0

          # If this URL is satisfied by a pre-seeded archive, copy it into the
          # cache and skip the network entirely. Zig still verifies the hash.
          seed_for_url=""
          if [ -f "$seeds_dir/MANIFEST" ]; then
            seed_for_url="$(awk -v u="$url" '$2 == u { print $1; exit }' "$seeds_dir/MANIFEST")"
          fi
          if [ -n "$seed_for_url" ] && [ -f "$cache_dir/p/$seed_for_url" ]; then
            echo "satisfied from seed: $url"
            seeded_urls=$((seeded_urls + 1))
            ok=1
          else
            attempt=1
            while [ "$attempt" -le "$ATTEMPTS" ]; do
              if zig fetch "$url" >/dev/null 2>&1; then
                ok=1
                break
              fi
              echo "::warning::zig fetch failed (attempt ${attempt}/${ATTEMPTS}): $url"
              if [ "$attempt" -lt "$ATTEMPTS" ]; then
                # 15s, 30s, 45s ... bounded by ATTEMPTS; a transient CDN 5xx
                # clears well inside this window.
                sleep $((attempt * 15))
              fi
              attempt=$((attempt + 1))
            done
          fi

          if [ "$ok" -ne 1 ]; then
            echo "::error::could not fetch $url after ${ATTEMPTS} attempts"
            failed=$((failed + 1))
          else
            fetched_urls=$((fetched_urls + 1))
          fi
        done < "$list"

        if [ "$failed" -ne 0 ]; then
          echo "::error::${failed}/${total} dependencies could not be fetched; refusing to start a build that would fail on the same network fault"
          exit 1
        fi
        echo "Pre-fetched ${total} zig dependencies into $ZIG_GLOBAL_CACHE_DIR (seeded=$seeded_urls fetched=$fetched_urls)"
